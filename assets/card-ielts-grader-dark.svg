<radialGradient id="corner" cx="1" cy="0" r="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset=".6" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="599" height="235" rx="18" fill="#060910" stroke="#1a2540"/>
