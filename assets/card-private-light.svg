<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="272" viewBox="0 0 600 272" role="img" aria-labelledby="title desc">
<title id="title">Production AI Agents</title><desc id="desc">Agents that hold real conversations end to end: reasoning, tools, vision, memory, human handoff and metrics, shipped to production. The code is private; the skyline above is the trail it left.</desc>
<style>
.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.run{animation:run 9s linear infinite;animation-delay:-0.0s}@keyframes run{to{stroke-dashoffset:-1708.5}}
.blink{animation:blink 1.6s steps(1) infinite}@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="600" height="272" rx="18"/></clipPath>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="haze" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<radialGradient id="corner" cx="1" cy="0" r="1"><stop offset="0" stop-color="#db2777" stop-opacity=".22"/><stop offset=".6" stop-color="#db2777" stop-opacity="0"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="599" height="271" rx="18" fill="#ffffff" stroke="#dde4ef"/>
<g clip-path="url(#card)">
<rect width="600" height="272" fill="url(#corner)"/>
<text class="s" x="574" y="88" font-size="84" font-weight="800" text-anchor="end" fill="none" stroke="#dde4ef" stroke-width="1.5">01</text>
<rect x="28" y="26" width="123.7" height="24" rx="12" fill="#db2777" fill-opacity=".12" stroke="#db2777" stroke-opacity=".45"/>
<circle class="blink" cx="42" cy="38" r="3.5" fill="#db2777"/>
<text class="m" x="52" y="42" font-size="11" font-weight="700" letter-spacing="1" fill="#db2777">PRIVATE · NDA</text>
<text class="s" x="28" y="98" font-size="29" font-weight="700" fill="#0b1220">Production AI Agents</text>
<text class="s" x="28" y="132" font-size="17" fill="#56627a">Agents that hold real conversations end to end: reasoning,</text>
<text class="s" x="28" y="155" font-size="17" fill="#56627a">tools, vision, memory, human handoff and metrics, shipped</text>
<text class="s" x="28" y="178" font-size="17" fill="#56627a">to production. The code is private; the skyline above is</text>
<text class="s" x="28" y="201" font-size="17" fill="#56627a">the trail it left.</text>
<rect x="28" y="220" width="102" height="28" rx="14" fill="#f7f9fc" stroke="#dde4ef"/><text class="m" x="79" y="239" font-size="13" text-anchor="middle" fill="#56627a">TypeScript</text><rect x="138" y="220" width="102" height="28" rx="14" fill="#f7f9fc" stroke="#dde4ef"/><text class="m" x="189" y="239" font-size="13" text-anchor="middle" fill="#56627a">LLM agents</text><rect x="248" y="220" width="109.8" height="28" rx="14" fill="#f7f9fc" stroke="#dde4ef"/><text class="m" x="302.9" y="239" font-size="13" text-anchor="middle" fill="#56627a">Multi-agent</text><rect x="365.8" y="220" width="47.4" height="28" rx="14" fill="#f7f9fc" stroke="#dde4ef"/><text class="m" x="389.5" y="239" font-size="13" text-anchor="middle" fill="#56627a">E2E</text>
<text class="m" x="572" y="239" font-size="13" text-anchor="end" fill="#56627a">source: private</text>
<rect class="run" x="1" y="1" width="598" height="270" rx="17" fill="none" stroke="#db2777" stroke-width="2" stroke-dasharray="150 1558.5" stroke-linecap="round"/>
</g>
</svg>
