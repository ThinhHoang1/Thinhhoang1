<title id="title">Arsenal</title><desc id="desc">AGENTS &amp; LLM: Claude, Claude Code, Gemini, OpenAI, MCP, LangChain, RAG, n8n. BACKEND: TypeScript, Node.js, Bun, Hono, Python, FastAPI, PostgreSQL, Redis, RabbitMQ, MongoDB, Supabase. FRONTEND: React, Next.js, Vite, Tailwind, Streamlit. ML · VISION: PyTorch, Transformers, YOLO, EfficientNet, scikit-learn. SHIP &amp; TEST: Docker, Playwright, GitHub Actions, GitLab CI, Vercel</desc>
<style>
