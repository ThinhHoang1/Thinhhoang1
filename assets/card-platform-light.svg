<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="272" viewBox="0 0 600 272" role="img" aria-labelledby="title desc">
<title id="title">Agent Platform Tooling</title><desc id="desc">OpenClaw plugins, skills and installable agent workspaces; a schema-driven UI engine that renders agent dashboards from YAML; E2E suites that drive the product like a real user.</desc>
<style>
