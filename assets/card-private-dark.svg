<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="236" viewBox="0 0 600 236" role="img" aria-labelledby="title desc">
<title id="title">Production AI Agents</title><desc id="desc">Agents that hold real conversations end to end: reasoning, tools, vision, memory, human handoff and metrics, shipped to production. The code is private; the skyline above is the trail it left.</desc>
<style>
.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.run{animation:run 9s linear infinite;animation-delay:-0.0s}@keyframes run{to{stroke-dashoffset:-1636.5}}
.blink{animation:blink 1.6s steps(1) infinite}@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="600" height="236" rx="18"/></clipPath>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="haze" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<radialGradient id="corner" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".22"/><stop offset=".6" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="599" height="235" rx="18" fill="#060910" stroke="#1a2540"/>
<g clip-path="url(#card)">
<rect width="600" height="236" fill="url(#corner)"/>
<text class="s" x="574" y="88" font-size="84" font-weight="800" text-anchor="end" fill="none" stroke="#1a2540" stroke-width="1.5">01</text>
<rect x="28" y="26" width="123.7" height="24" rx="12" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".45"/>
<circle class="blink" cx="42" cy="38" r="3.5" fill="#f472b6"/>
<text class="m" x="52" y="42" font-size="11" font-weight="700" letter-spacing="1" fill="#f472b6">PRIVATE · NDA</text>
<text class="s" x="28" y="94" font-size="26" font-weight="700" fill="#e8eefc">Production AI Agents</text>
<text class="s" x="28" y="124" font-size="15" fill="#8391ad">Agents that hold real conversations end to end: reasoning, tools,</text>
<text class="s" x="28" y="145" font-size="15" fill="#8391ad">vision, memory, human handoff and metrics, shipped to production.</text>
<text class="s" x="28" y="166" font-size="15" fill="#8391ad">The code is private; the skyline above is the trail it left.</text>
<rect x="28" y="188" width="94" height="26" rx="13" fill="#0b1120" stroke="#1a2540"/><text class="m" x="75" y="205.5" font-size="12" text-anchor="middle" fill="#8391ad">TypeScript</text><rect x="130" y="188" width="94" height="26" rx="13" fill="#0b1120" stroke="#1a2540"/><text class="m" x="177" y="205.5" font-size="12" text-anchor="middle" fill="#8391ad">LLM agents</text><rect x="232" y="188" width="101.2" height="26" rx="13" fill="#0b1120" stroke="#1a2540"/><text class="m" x="282.6" y="205.5" font-size="12" text-anchor="middle" fill="#8391ad">Multi-agent</text><rect x="341.2" y="188" width="43.6" height="26" rx="13" fill="#0b1120" stroke="#1a2540"/><text class="m" x="363" y="205.5" font-size="12" text-anchor="middle" fill="#8391ad">E2E</text>
<text class="m" x="572" y="206" font-size="12" text-anchor="end" fill="#8391ad">source: private</text>
<rect class="run" x="1" y="1" width="598" height="234" rx="17" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="150 1486.5" stroke-linecap="round"/>
</g>
</svg>
