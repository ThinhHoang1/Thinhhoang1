<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="472" viewBox="0 0 1200 472" role="img" aria-labelledby="title desc">
<title id="title">Arsenal</title><desc id="desc">AGENTS &amp; LLM: OpenClaw, Claude, Claude Code, Gemini, OpenAI, MCP, LiteLLM, RAG, n8n. MESSAGING: Messenger Platform, Graph API, Zalo OA, Webhooks · HMAC, VN e-commerce APIs. BACKEND: TypeScript, Node.js, Bun, Hono, Python, FastAPI, PostgreSQL, Redis, RabbitMQ, MongoDB, S3 · CDN. FRONTEND: React, Next.js, Vite, Tailwind, Streamlit. ML · VISION: PyTorch, Transformers, YOLO, EfficientNet, scikit-learn. SHIP &amp; TEST: Docker, Playwright, GitHub Actions, GitLab CI, Vercel</desc>
<style>
.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.drift{animation:drift 18s ease-in-out infinite alternate}.d1{animation-duration:23s}.d2{animation-duration:29s}
@keyframes drift{to{transform:translate(40px,18px)}}
.pop{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
