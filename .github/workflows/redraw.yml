name: redraw profile

on:
  schedule:
    - cron: "17 17 * * *" # 00:17 in UTC+7
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.config.json, data/private-activity.json, scripts/**]

permissions:
  contents: write

concurrency:
  group: redraw
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data/github.json
          git diff --cached --quiet || { git commit -m "chore: redraw profile" && git push; }
